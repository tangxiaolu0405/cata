name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build ${{ matrix.artifact }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            artifact: cata-linux-amd64
            archive_ext: tar.gz
            bin_name: cata

          - goos: darwin
            goarch: amd64
            artifact: cata-darwin-amd64
            archive_ext: tar.gz
            bin_name: cata

          - goos: darwin
            goarch: arm64
            artifact: cata-darwin-arm64
            archive_ext: tar.gz
            bin_name: cata

          - goos: windows
            goarch: 386
            artifact: cata-windows-386
            archive_ext: zip
            bin_name: cata.exe

          - goos: windows
            goarch: amd64
            artifact: cata-windows-amd64
            archive_ext: zip
            bin_name: cata.exe

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.21"

      - name: Build and package
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
          ARTIFACT: ${{ matrix.artifact }}
          ARCHIVE_EXT: ${{ matrix.archive_ext }}
          BIN_NAME: ${{ matrix.bin_name }}
        run: |
          set -euo pipefail
          mkdir -p dist
          go build -ldflags="-s -w" -o "dist/${BIN_NAME}" ./cmd/cata

          ARCHIVE="${ARTIFACT}.${ARCHIVE_EXT}"
          if [ "${ARCHIVE_EXT}" = "zip" ]; then
            (cd dist && zip -r "../${ARCHIVE}" "${BIN_NAME}")
          else
            chmod +x "dist/${BIN_NAME}"
            tar -czf "${ARCHIVE}" -C dist "${BIN_NAME}"
          fi
          ls -la "${ARCHIVE}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.${{ matrix.archive_ext }}

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate release notes from commits
        shell: bash
        env:
          CURRENT_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          PREV_TAG=$(git describe --tags --abbrev=0 "${CURRENT_TAG}^" 2>/dev/null || true)

          {
            echo "## ${CURRENT_TAG}"
            echo
            if [ -n "${PREV_TAG}" ]; then
              echo "Changes since \`${PREV_TAG}\`:"
            else
              echo "Initial release (all commits):"
            fi
            echo
            if [ -n "${PREV_TAG}" ]; then
              git log "${PREV_TAG}..${CURRENT_TAG}" --pretty=format:"- %s (\`%h\`)" --reverse
            else
              git log --pretty=format:"- %s (\`%h\`)" --reverse
            fi
            echo
            echo
            echo "## Downloads"
            echo
            echo "- Linux / macOS: \`cata\` in \`.tar.gz\`"
            echo "- Windows: \`cata.exe\` in \`.zip\`"
            echo
            echo '```bash'
            echo "tar -xzf cata-linux-amd64.tar.gz && ./cata"
            echo "tar -xzf cata-darwin-arm64.tar.gz && ./cata"
            echo "unzip cata-windows-amd64.zip && cata.exe chat"
            echo '```'
          } > release_notes.md

          echo "---- release notes preview ----"
          head -40 release_notes.md

      - name: List release assets
        run: find artifacts -type f | sort

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: release_notes.md
          files: |
            artifacts/**/*
          draft: false
          prerelease: false
