name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build ${{ matrix.artifact }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            artifact: cata-linux-amd64
            archive_ext: tar.gz
            bin_name: cata

          - goos: darwin
            goarch: amd64
            artifact: cata-darwin-amd64
            archive_ext: tar.gz
            bin_name: cata

          - goos: darwin
            goarch: arm64
            artifact: cata-darwin-arm64
            archive_ext: tar.gz
            bin_name: cata

          - goos: windows
            goarch: 386
            artifact: cata-windows-386
            archive_ext: zip
            bin_name: cata.exe

          - goos: windows
            goarch: amd64
            artifact: cata-windows-amd64
            archive_ext: zip
            bin_name: cata.exe

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.21"

      - name: Build and package
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
          ARTIFACT: ${{ matrix.artifact }}
          ARCHIVE_EXT: ${{ matrix.archive_ext }}
          BIN_NAME: ${{ matrix.bin_name }}
        run: |
          set -euo pipefail
          mkdir -p dist
          if [[ "${BIN_NAME}" == *.exe ]]; then
            GATEWAY_BIN="cata-gateway.exe"
          else
            GATEWAY_BIN="cata-gateway"
          fi
          go build -ldflags="-s -w" -o "dist/${BIN_NAME}" ./cmd/cata
          go build -ldflags="-s -w" -o "dist/${GATEWAY_BIN}" ./cmd/cata-gateway

          ARCHIVE="${ARTIFACT}.${ARCHIVE_EXT}"
          if [ "${ARCHIVE_EXT}" = "zip" ]; then
            (cd dist && zip -r "../${ARCHIVE}" "${BIN_NAME}" "${GATEWAY_BIN}")
          else
            chmod +x "dist/${BIN_NAME}" "dist/${GATEWAY_BIN}"
            tar -czf "${ARCHIVE}" -C dist "${BIN_NAME}" "${GATEWAY_BIN}"
          fi
          ls -la "${ARCHIVE}" dist/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.${{ matrix.archive_ext }}

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate release notes from commits
        shell: bash
        env:
          CURRENT_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          PREV_TAG=$(git describe --tags --abbrev=0 "${CURRENT_TAG}^" 2>/dev/null || true)

          write_commit_log() {
            git log "$@" --reverse --format=%H | while IFS= read -r sha; do
              subject=$(git show -s --format=%s "$sha")
              short=$(git show -s --format=%h "$sha")
              body=$(git show -s --format=%b "$sha")
              printf -- '- %s (`%s`)\n' "$subject" "$short"
              # %b 含 commit body；多行时缩进挂在同一列表项下，避免只保留 subject 丢信息
              if [ -n "${body//[[:space:]]/}" ]; then
                while IFS= read -r line || [ -n "$line" ]; do
                  printf '  %s\n' "$line"
                done <<< "$body"
              fi
              echo
            done
          }

          {
            echo "## ${CURRENT_TAG}"
            echo
            if [ -n "${PREV_TAG}" ]; then
              echo "Changes since \`${PREV_TAG}\`:"
            else
              echo "Initial release (all commits):"
            fi
            echo
            if [ -n "${PREV_TAG}" ]; then
              write_commit_log "${PREV_TAG}..${CURRENT_TAG}"
            else
              write_commit_log
            fi
            echo
            echo "## Downloads"
            echo
            echo "- Linux / macOS: \`cata\` + \`cata-gateway\` in \`.tar.gz\`"
            echo "- Windows: \`cata.exe\` + \`cata-gateway.exe\` in \`.zip\`"
            echo
            echo '```bash'
            echo "tar -xzf cata-linux-amd64.tar.gz && ./cata && ./cata-gateway --help"
            echo "tar -xzf cata-darwin-arm64.tar.gz && ./cata"
            echo "unzip cata-windows-amd64.zip && cata.exe chat"
            echo '```'
          } > release_notes.md

          echo "---- release notes preview ----"
          head -60 release_notes.md

      - name: List release assets
        run: find artifacts -type f | sort

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: release_notes.md
          files: |
            artifacts/**/*
          draft: false
          prerelease: false
